<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SyahFlavor QR Ledger</title>
<meta name="description" content="Upload the Maybank QRPay export, get a per-QR-ID summary and a sorted, totalled spreadsheet back — nothing leaves your phone.">
<style>
  :root{
    color-scheme: light dark;
    --ink:#201A16; --paper:#F3F0E8; --paper-2:#EAE4D6;
    --ember:#D8451B; --ember-ink:#FFF6F0;
    --jade:#1F6F54; --jade-ink:#EAF7F1;
    --turmeric:#A9700F; --turmeric-ink:#FDF4E1;
    --line: rgba(32,26,22,.14);
    --text: var(--ink); --text-dim:#5B554C;
    --surface:#FFFFFF; --surface-2: var(--paper-2); --bg: var(--paper);
    --shadow: 0 1px 2px rgba(32,26,22,.07), 0 6px 18px rgba(32,26,22,.07);
    --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
    --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#F3EFE7; --paper:#17130F; --paper-2:#221C15;
      --ember:#FF7A4A; --ember-ink:#2A1206;
      --jade:#57D9AB; --jade-ink:#0C2721;
      --turmeric:#E8B24E; --turmeric-ink:#2C1E07;
      --line: rgba(243,239,231,.14); --text: var(--ink); --text-dim:#B7B0A2;
      --surface:#221C15; --surface-2:#2B241B; --bg: var(--paper);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2{ font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; }
  .wrap{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  header{ display:flex; align-items:center; gap:10px; }
  .mark{
    width:38px; height:38px; border-radius:10px; flex:none;
    background:var(--ember); color:var(--ember-ink);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:1.15rem;
  }
  header .title{ display:flex; flex-direction:column; line-height:1.25; }
  header .title strong{ font-size:1.25rem; }
  header .title span{ font-size:.78rem; color:var(--text-dim); }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px; box-shadow:var(--shadow);
  }

  .dropzone{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    border:1.5px dashed var(--line); border-radius:13px; padding:26px 14px;
    cursor:pointer; color:var(--text-dim); font-weight:600; font-size:.95rem; text-align:center;
  }
  .dropzone svg{ width:1.8em; height:1.8em; color:var(--ember); }
  .dropzone small{ font-weight:400; font-size:.78rem; }
  #fileInput{ display:none; }
  .status-line{ font-size:.82rem; color:var(--text-dim); margin-top:10px; min-height:1.1em; }
  .status-line.error{ color:var(--ember); font-weight:600; }

  #results{ display:none; flex-direction:column; gap:18px; }
  #results.show{ display:flex; }

  .range-note{ font-size:.82rem; color:var(--text-dim); }

  .grand{ display:flex; flex-direction:column; gap:6px; }
  .grand .label{ font-size:.8rem; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; }
  .copy-amt{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--jade-ink); color:var(--jade); border:none; border-radius:13px;
    padding:16px 18px; cursor:pointer; width:100%; text-align:left;
  }
  .copy-amt .num{ font-family:var(--font-display); font-weight:700; font-size:2rem; font-variant-numeric: tabular-nums; }
  .copy-amt .hint{ font-size:.72rem; opacity:.8; font-weight:600; white-space:nowrap; }
  .copy-amt.copied .hint::after{ content:' ✓'; }

  .subtitle{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .subtitle h2{ font-size:1.05rem; }
  .subtitle .count{ font-size:.78rem; color:var(--text-dim); }

  .term-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .term-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .term-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .term-name{ font-weight:700; font-size:.95rem; overflow-wrap:anywhere; }
  .term-count{ font-size:.75rem; color:var(--text-dim); white-space:nowrap; }
  .copy-sub{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border:none; border-radius:10px;
    padding:11px 13px; cursor:pointer; width:100%; text-align:left; color:var(--text);
  }
  .copy-sub .num{ font-family:var(--font-display); font-weight:700; font-size:1.3rem; font-variant-numeric: tabular-nums; }
  .copy-sub .hint{ font-size:.68rem; color:var(--text-dim); font-weight:600; white-space:nowrap; }
  .copy-sub.copied .hint::after{ content:' ✓'; color:var(--jade); }
  .term-extra{ display:grid; grid-template-columns:repeat(2,1fr); gap:4px 10px; font-size:.76rem; color:var(--text-dim); }
  .term-extra span b{ color:var(--text); font-weight:600; font-variant-numeric: tabular-nums; }

  .download-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--ember); color:var(--ember-ink); border:none; border-radius:13px;
    padding:15px; font-weight:700; font-size:1rem; cursor:pointer; box-shadow:var(--shadow);
  }
  .download-btn svg{ width:1.2em; height:1.2em; }

  .reset-link{
    align-self:center; background:none; border:none; color:var(--text-dim);
    font-size:.8rem; text-decoration:underline; cursor:pointer; padding:6px;
  }

  .stateless-note{
    font-size:.76rem; color:var(--text-dim); text-align:center; line-height:1.5;
  }

  .warn-title{ font-weight:700; font-size:.9rem; }
  .warn-body{ font-size:.8rem; color:var(--text); }
  .warn-card{
    background:var(--turmeric-ink); border:1px solid var(--turmeric); color:var(--turmeric);
    border-radius:13px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; margin-top:10px;
  }
  .blocking-error{
    background:var(--ember-ink); border:1px solid var(--ember); color:var(--ember);
    border-radius:13px; padding:14px; display:flex; flex-direction:column; gap:6px; margin-top:10px;
  }
  .warn-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-small{
    border:1.5px solid currentColor; background:transparent; color:inherit;
    border-radius:9px; padding:8px 12px; font-weight:700; font-size:.8rem; cursor:pointer;
  }
  .warn-card .btn-small.primary{ background:var(--turmeric); color:var(--turmeric-ink); border-color:transparent; }
  .blocking-error .btn-small.primary{ background:var(--ember); color:var(--ember-ink); border-color:transparent; }
  .evidence-box{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; font-size:.78rem; color:var(--text-dim); margin-top:10px;
  }
  .evidence-box b{ color:var(--text); font-variant-numeric: tabular-nums; }
  .recovered-note{
    font-size:.78rem; color:var(--text-dim); background:var(--surface-2); border-radius:10px;
    padding:9px 11px; margin-top:10px;
  }
  .undetermined{ color:var(--text-dim) !important; font-style:italic; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="mark">SF</span>
      <div class="title">
        <strong>SyahFlavor QR Ledger</strong>
        <span>Upload the bank export, get totals back</span>
      </div>
    </header>

    <div class="card">
      <label class="dropzone" for="fileInput" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="dropzoneLabel">Upload Maybank QRPay export (.xlsx)</span>
        <small>Tap to choose a file</small>
      </label>
      <input id="fileInput" type="file" accept=".xlsx,.xls">
      <div class="status-line" id="statusLine"></div>
      <div id="issuesBlock"></div>
    </div>

    <div id="results">
      <p class="range-note" id="rangeNote"></p>

      <div class="grand">
        <span class="label">Grand total — Amount Paid to Merchant</span>
        <button class="copy-amt" id="copyGrand" type="button">
          <span class="num" id="grandNum">RM 0.00</span>
          <span class="hint">Tap to copy</span>
        </button>
      </div>

      <div>
        <div class="subtitle">
          <h2>Per QR ID</h2>
          <span class="count" id="termCount">0 terminals</span>
        </div>
        <ul class="term-list" id="termList"></ul>
      </div>

      <button class="download-btn" id="downloadBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download processed file
      </button>

      <button class="reset-link" id="resetBtn" type="button">Process another file</button>
    </div>

    <p class="stateless-note">Nothing is uploaded to a server — the file is read and totalled entirely on this phone. Close this tab and it's gone; reload to start again.</p>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
  "use strict";

  function norm(s){ return (s==null?'':String(s)).toLowerCase().replace(/[^a-z0-9]/g,''); }
  function fmtRM(n){ return 'RM ' + (Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtDate(d){
    if(!(d instanceof Date) || isNaN(d)) return '';
    return d.toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'});
  }

  var fileInput = document.getElementById('fileInput');
  var dropzoneLabel = document.getElementById('dropzoneLabel');
  var statusLine = document.getElementById('statusLine');
  var results = document.getElementById('results');
  var rangeNote = document.getElementById('rangeNote');
  var grandNum = document.getElementById('grandNum');
  var copyGrand = document.getElementById('copyGrand');
  var termList = document.getElementById('termList');
  var termCount = document.getElementById('termCount');
  var downloadBtn = document.getElementById('downloadBtn');
  var resetBtn = document.getElementById('resetBtn');
  var issuesBlock = document.getElementById('issuesBlock');

  // state.roles[key] = { label, status, col }
  //   status: 'matched' (found by header name) | 'pending' (not found yet, awaiting user)
  //         | 'candidate' (heuristic found something, awaiting confirm) | 'recovered' (user confirmed)
  //         | 'unresolved' (searched and nothing usable, or user declined)
  var state = null;

  function showError(msg){
    statusLine.textContent = msg;
    statusLine.classList.add('error');
    results.classList.remove('show');
  }
  function showStatus(msg){
    statusLine.textContent = msg;
    statusLine.classList.remove('error');
  }

  function copyToClipboard(text, btn){
    var done = function(){
      btn.classList.add('copied');
      setTimeout(function(){ btn.classList.remove('copied'); }, 1400);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  fileInput.addEventListener('change', function(){
    var file = fileInput.files && fileInput.files[0];
    if(!file) return;
    dropzoneLabel.textContent = file.name;
    showStatus('Reading file…');
    var reader = new FileReader();
    reader.onload = function(){
      try{ processWorkbook(new Uint8Array(reader.result), file.name); }
      catch(err){ showError("Couldn't read that file — make sure it's the .xlsx export, not a screenshot or PDF."); }
    };
    reader.onerror = function(){ showError('Could not read the file from your phone storage. Try again.'); };
    reader.readAsArrayBuffer(file);
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function findCol(headers, needle){
    var nn = norm(needle);
    var exact = headers.findIndex(function(h){ return norm(h)===nn; });
    if(exact>=0) return exact;
    return headers.findIndex(function(h){ return norm(h).indexOf(nn)>=0; });
  }

  function isNumericColumn(headers, dataRows, c){
    var allNumeric=true, sawAny=false;
    for(var r=0;r<dataRows.length;r++){
      var v = dataRows[r][c];
      if(v===null || v==='') continue;
      sawAny = true;
      if(typeof v!=='number'){ allNumeric=false; break; }
    }
    return sawAny && allNumeric;
  }

  // ---------- content-shape recovery, used only after the user asks for it ----------

  // Date & Time: score each column by the fraction of its values that parse as a real date.
  function findDateCandidate(headers, dataRows, excludeCols){
    var best=-1, bestScore=0;
    for(var c=0;c<headers.length;c++){
      if(excludeCols.indexOf(c)>=0) continue;
      var ok=0, total=0;
      for(var r=0;r<dataRows.length;r++){
        var v = dataRows[r][c];
        if(v===null || v==='') continue;
        total++;
        if(v instanceof Date && !isNaN(v)) ok++;
        else if(typeof v==='number' && v>20000 && v<60000) ok++; // plausible Excel date serial
        else if(typeof v==='string' && !isNaN(Date.parse(v))) ok++;
      }
      var score = total ? ok/total : 0;
      if(score>bestScore){ bestScore=score; best=c; }
    }
    if(bestScore<0.9) return null;
    var v0 = dataRows.map(function(r){ return r[best]; }).filter(function(v){ return v!=null && v!==''; })[0];
    return { col:best, sample: (v0 instanceof Date) ? fmtDate(v0) : String(v0) };
  }

  // QR ID: alphanumeric, length >= 4, AND repeats (2..~10 distinct values, never 1, never ~one-per-row) —
  // the repetition test is what separates a QR terminal id from a Transaction ID (unique per row)
  // or a Merchant ID (same value every row); "alphanumeric + length" alone matches all of those too.
  function findQrIdCandidate(headers, dataRows, excludeCols){
    var n = dataRows.length, best=null, bestScore=-1;
    for(var c=0;c<headers.length;c++){
      if(excludeCols.indexOf(c)>=0) continue;
      var shaped=0, total=0, seen={}, firstVal=null;
      for(var r=0;r<n;r++){
        var v = dataRows[r][c];
        if(v===null || v==='') continue;
        total++;
        var sv = String(v).trim();
        if(typeof v==='string' && /^[A-Za-z0-9]{4,}$/.test(sv)){ shaped++; seen[sv]=(seen[sv]||0)+1; if(!firstVal) firstVal=sv; }
      }
      if(total===0) continue;
      var shapedFrac = shaped/total;
      if(shapedFrac<0.9) continue;
      var distinct = Object.keys(seen).length;
      if(distinct<=1 || distinct>Math.max(10, n*0.05)) continue;
      var score = shapedFrac - (distinct/n);
      if(score>bestScore){ bestScore=score; best={ col:c, sample:firstVal, distinctCount:distinct, occurrences: seen[firstVal] }; }
    }
    return best;
  }

  // Amount: among fully-numeric columns, prefer one whose header hints at "amount/paid/total",
  // otherwise the numeric column with the largest average magnitude (real settlement amounts
  // dominate discount/GST/rate columns, which cluster near zero).
  function findAmountCandidate(headers, dataRows, excludeCols){
    var candidates = [];
    for(var c=0;c<headers.length;c++){
      if(excludeCols.indexOf(c)>=0) continue;
      if(!isNumericColumn(headers, dataRows, c)) continue;
      var sum=0, n=0;
      for(var r=0;r<dataRows.length;r++){
        var v = dataRows[r][c];
        if(v===null || v==='') continue;
        sum+=v; n++;
      }
      var h = norm(headers[c]);
      var hinted = h.indexOf('amount')>=0 || h.indexOf('paid')>=0 || h.indexOf('total')>=0;
      candidates.push({ col:c, avg: n?sum/n:0, hinted: hinted });
    }
    if(!candidates.length) return null;
    // rank hinted columns first, by magnitude within each group — but ties are checked against
    // the FULL candidate set below, not just the hinted subset, so a renamed column that lost its
    // hint keyword can still be caught as an ambiguous match instead of silently going unflagged
    var ranked = candidates.slice().sort(function(a,b){
      if(a.hinted!==b.hinted) return a.hinted ? -1 : 1;
      return b.avg - a.avg;
    });
    var top = ranked[0];
    var ties = candidates.filter(function(cd){
      return cd.col!==top.col && top.avg!==0 && Math.abs(cd.avg-top.avg)/Math.abs(top.avg) < 0.01;
    }).map(function(cd){ return headers[cd.col]; });
    return { col: top.col, sample: fmtRM(top.avg) + ' avg', ties: ties };
  }

  function excludedCols(){
    var r = state.roles;
    return [r.time.col, r.term.col, r.amt.col].filter(function(c){ return c>=0; });
  }

  function processWorkbook(bytes, sourceName){
    var wb = XLSX.read(bytes, {type:'array', cellDates:true});
    var ws = wb.Sheets[wb.SheetNames[0]];
    var aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
    if(!aoa.length){ showError('That file has no rows.'); return; }
    var headers = aoa[0].map(function(h){ return h==null ? '' : String(h); });
    var dataRows = aoa.slice(1).filter(function(r){ return r.some(function(c){ return c!==null && c!==''; }); });
    if(!dataRows.length){ showError('That file has a header row but no transactions.'); return; }

    var timeCol = findCol(headers, 'Date & Time');
    var termCol = findCol(headers, 'Cashier ID/Terminal ID');
    if(termCol<0) termCol = findCol(headers, 'Terminal ID');
    var amtCol = findCol(headers, 'Amount Paid to Merchant (RM)');
    if(amtCol<0) amtCol = findCol(headers, 'Amount Paid to Merchant');

    state = {
      headers: headers, dataRows: dataRows, sourceName: sourceName,
      roles: {
        time: { label:'Date & Time', status: timeCol>=0 ? 'matched':'pending', col: timeCol },
        term: { label:'QR ID (Terminal)', status: termCol>=0 ? 'matched':'pending', col: termCol },
        amt:  { label:'Amount Paid to Merchant', status: amtCol>=0 ? 'matched':'pending', col: amtCol }
      }
    };
    showStatus(dataRows.length + ' rows read.');
    refresh();
  }

  function handleIssueAction(key, action){
    var role = state.roles[key];
    if(action==='skip'){ role.status='unresolved'; refresh(); return; }
    if(action==='locate'){
      var excl = excludedCols();
      var candidate = null;
      if(key==='time') candidate = findDateCandidate(state.headers, state.dataRows, excl);
      else if(key==='term') candidate = findQrIdCandidate(state.headers, state.dataRows, excl);
      else if(key==='amt') candidate = findAmountCandidate(state.headers, state.dataRows, excl);
      if(candidate){ role.status='candidate'; role.candidate=candidate; }
      else { role.status='unresolved'; }
      refresh();
      return;
    }
    if(action==='confirm'){ role.status='recovered'; role.col=role.candidate.col; refresh(); return; }
    if(action==='reject'){ role.status='unresolved'; refresh(); return; }
  }

  function renderIssues(){
    var r = state.roles, html = '';
    ['time','term','amt'].forEach(function(key){
      var role = r[key];
      if(role.status==='pending'){
        html += '<div class="warn-card">' +
          '<span class="warn-title">Couldn’t find “'+escapeHtml(role.label)+'” by column name</span>' +
          '<span class="warn-body">This export’s format may have changed. We can search the data itself for a column that looks right.</span>' +
          '<div class="warn-actions">' +
          '<button class="btn-small primary" data-role="'+key+'" data-action="locate" type="button">Try to locate it</button>' +
          '<button class="btn-small" data-role="'+key+'" data-action="skip" type="button">Mark as cannot be determined</button>' +
          '</div></div>';
      } else if(role.status==='candidate'){
        var c = role.candidate;
        html += '<div class="warn-card">' +
          '<span class="warn-title">Possible match for “'+escapeHtml(role.label)+'”</span>' +
          '<div class="evidence-box">Column <b>'+escapeHtml(state.headers[c.col])+'</b><br>' +
          'Example value: <b>'+escapeHtml(String(c.sample))+'</b>' +
          (c.distinctCount ? (' · '+c.distinctCount+' distinct values across '+state.dataRows.length+' rows') : '') +
          (c.ties && c.ties.length ? ('<br><b>Heads up:</b> '+escapeHtml(c.ties.join(', '))+' look(s) numerically identical in this file — could be a before-discount figure rather than the real paid amount. Check carefully before using.') : '') +
          '</div>' +
          '<div class="warn-actions">' +
          '<button class="btn-small primary" data-role="'+key+'" data-action="confirm" type="button">Use this column</button>' +
          '<button class="btn-small" data-role="'+key+'" data-action="reject" type="button">No, mark as undetermined</button>' +
          '</div></div>';
      } else if(role.status==='unresolved'){
        var cls = (key==='amt') ? 'blocking-error' : 'warn-card';
        html += '<div class="'+cls+'"><span class="warn-title">“'+escapeHtml(role.label)+'” — cannot be determined</span>' +
          '<span class="warn-body">No column matched by name or by data shape.' +
          (key==='amt' ? ' This file can’t be summarized until this is resolved — try a different export, or check if the amount column was renamed.' : ' Related totals below will show as undetermined.') +
          '</span></div>';
      } else if(role.status==='recovered'){
        html += '<div class="recovered-note">“'+escapeHtml(role.label)+'” auto-recovered from column <b>'+escapeHtml(state.headers[role.col])+'</b> — double check this looks right before trusting the totals.</div>';
      }
    });
    issuesBlock.innerHTML = html;
    issuesBlock.querySelectorAll('button[data-action]').forEach(function(btn){
      btn.addEventListener('click', function(){ handleIssueAction(btn.dataset.role, btn.dataset.action); });
    });
  }

  function finalizeRows(){
    var r = state.roles;
    var timeOk = r.time.status==='matched' || r.time.status==='recovered';
    var termOk = r.term.status==='matched' || r.term.status==='recovered';
    var timeCol = r.time.col, termCol = r.term.col;

    state.rows = state.dataRows.map(function(row, idx){
      var time = null;
      if(timeOk){
        var t = row[timeCol];
        var d = (t instanceof Date) ? t : (typeof t==='number' ? new Date(Math.round((t-25569)*86400*1000)) : new Date(t));
        if(!isNaN(d)) time = d;
      }
      var term = termOk ? (row[termCol]==null || row[termCol]==='' ? '(no QR ID recorded)' : String(row[termCol])) : null;
      return { cells: row, time: time, term: term, idx: idx };
    });

    state.rows.sort(function(a,b){
      if(termOk && a.term!==b.term) return a.term<b.term ? -1 : 1;
      if(timeOk && a.time && b.time) return a.time - b.time;
      return a.idx - b.idx;
    });

    var summable = [];
    for(var c=0;c<state.headers.length;c++){
      if(c===timeCol || c===termCol) continue;
      if(isNumericColumn(state.headers, state.dataRows, c)) summable.push(c);
    }
    state.summableCols = summable;
  }

  function refresh(){
    renderIssues();
    var r = state.roles;
    if(r.amt.status==='pending' || r.amt.status==='candidate' || r.amt.status==='unresolved'){
      // amount is a hard requirement — no partial totals without it
      results.classList.remove('show');
      if(r.amt.status==='unresolved') showStatus('Cannot summarize this file.');
      return;
    }
    finalizeRows();
    renderSummary();
    showStatus(state.rows.length + ' transactions loaded.');
    results.classList.add('show');
  }

  function renderSummary(){
    var r = state.roles;
    var rows = state.rows, headers = state.headers, amtCol = r.amt.col, summableCols = state.summableCols;
    var timeOk = r.time.status==='matched' || r.time.status==='recovered';
    var termOk = r.term.status==='matched' || r.term.status==='recovered';

    if(timeOk){
      var known = rows.filter(function(row){ return row.time; });
      if(known.length){
        var minT=known[0].time, maxT=known[0].time;
        known.forEach(function(row){ if(row.time<minT) minT=row.time; if(row.time>maxT) maxT=row.time; });
        rangeNote.textContent = (fmtDate(minT)===fmtDate(maxT)) ? fmtDate(minT) : (fmtDate(minT) + ' – ' + fmtDate(maxT));
        rangeNote.classList.remove('undetermined');
      } else {
        rangeNote.textContent = 'Date range: cannot be determined';
        rangeNote.classList.add('undetermined');
      }
    } else {
      rangeNote.textContent = 'Date range: cannot be determined';
      rangeNote.classList.add('undetermined');
    }

    var grandTotal = 0;
    rows.forEach(function(row){ grandTotal += Number(row.cells[amtCol])||0; });
    grandNum.textContent = fmtRM(grandTotal);
    copyGrand.onclick = function(){ copyToClipboard(grandTotal.toFixed(2), copyGrand); };

    if(!termOk){
      termCount.textContent = 'cannot be determined';
      termList.innerHTML = '<li class="empty-note undetermined">QR ID column cannot be determined — per-terminal breakdown unavailable. The grand total above is still accurate.</li>';
      return;
    }

    var byTerm = {}, order = [];
    rows.forEach(function(row){
      if(!byTerm[row.term]){ byTerm[row.term] = {count:0, sums:{}}; order.push(row.term); }
      byTerm[row.term].count++;
      summableCols.forEach(function(c){
        byTerm[row.term].sums[c] = (byTerm[row.term].sums[c]||0) + (Number(row.cells[c])||0);
      });
    });

    termCount.textContent = order.length + ' terminal' + (order.length===1?'':'s');
    termList.innerHTML = '';
    order.forEach(function(term){
      var t = byTerm[term];
      var li = document.createElement('li');
      li.className = 'term-card';
      var extraCols = summableCols.filter(function(c){ return c!==amtCol; });
      var extraHtml = extraCols.map(function(c){
        return '<span>'+escapeHtml(headers[c])+': <b>'+fmtRM(t.sums[c])+'</b></span>';
      }).join('');
      li.innerHTML =
        '<div class="term-head"><span class="term-name">'+escapeHtml(term)+'</span>' +
        '<span class="term-count">'+t.count+' txn'+(t.count===1?'':'s')+'</span></div>' +
        '<button class="copy-sub" type="button"><span class="num">'+fmtRM(t.sums[amtCol])+'</span><span class="hint">Tap to copy</span></button>' +
        (extraHtml ? '<div class="term-extra">'+extraHtml+'</div>' : '');
      var btn = li.querySelector('.copy-sub');
      btn.addEventListener('click', function(){ copyToClipboard(t.sums[amtCol].toFixed(2), btn); });
      termList.appendChild(li);
    });
  }

  // Community SheetJS can't write freeze panes via ws['!freeze'], so after
  // XLSX builds the file we reopen the zip and patch the sheetView XML
  // directly to pin the header + summary rows in place.
  function exportWithFrozenHeader(wb, filename, freezeRows){
    function fallback(){ XLSX.writeFile(wb, filename); }
    try{
      var out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      JSZip.loadAsync(out).then(function(zip){
        var sheetPath = Object.keys(zip.files).filter(function(p){
          return /^xl\/worksheets\/sheet\d+\.xml$/.test(p);
        })[0];
        if(!sheetPath) throw new Error('worksheet xml not found');
        return zip.file(sheetPath).async('string').then(function(xml){
          var topLeft = 'A' + (freezeRows + 1);
          var patched = xml.replace(/<sheetView([^>]*)\/>/, function(_, attrs){
            return '<sheetView' + attrs + '>' +
              '<pane ySplit="' + freezeRows + '" topLeftCell="' + topLeft + '" activePane="bottomLeft" state="frozen"/>' +
              '<selection pane="bottomLeft" activeCell="' + topLeft + '" sqref="' + topLeft + '"/>' +
              '</sheetView>';
          });
          if(patched === xml) throw new Error('sheetView tag not found');
          zip.file(sheetPath, patched);
          return zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        });
      }).then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      }).catch(function(err){ console.warn('Freeze pane export failed, falling back', err); fallback(); });
    } catch(err){ console.warn('Freeze pane export failed, falling back', err); fallback(); }
  }

  downloadBtn.addEventListener('click', function(){
    if(!state || !state.rows) return;
    var headers = state.headers, rows = state.rows, summableCols = state.summableCols;
    var r = state.roles;
    var amtCol = r.amt.col, termCol = r.term.col, timeCol = r.time.col;
    var termOk = r.term.status==='matched' || r.term.status==='recovered';
    var timeOk = r.time.status==='matched' || r.time.status==='recovered';
    var labelCol = termOk ? termCol : 0;

    var grand = {};
    summableCols.forEach(function(c){ grand[c]=0; });
    rows.forEach(function(row){
      summableCols.forEach(function(c){ grand[c] += Number(row.cells[c])||0; });
    });

    // Summary-first layout: header row, then the grand total, then the
    // itemized/grouped detail. Freeze panes (applied below) pin both the
    // header and this summary row so they stay visible while scrolling.
    var aoa = [headers];
    var grandRow = headers.map(function(){ return null; });
    grandRow[labelCol] = termOk ? 'GRAND TOTAL' : 'GRAND TOTAL (QR ID column not found — rows not grouped)';
    summableCols.forEach(function(c){ grandRow[c] = grand[c]; });
    aoa.push(grandRow);
    aoa.push(headers.map(function(){ return null; }));

    function writeRow(row){
      var out = row.cells.slice();
      if(timeOk && row.time) out[timeCol] = row.time;
      aoa.push(out);
    }

    if(termOk){
      var byTerm = {}, order = [];
      rows.forEach(function(row){
        if(!byTerm[row.term]){ byTerm[row.term]=[]; order.push(row.term); }
        byTerm[row.term].push(row);
      });
      order.forEach(function(term){
        var group = byTerm[term];
        var sums = {};
        summableCols.forEach(function(c){ sums[c]=0; });
        group.forEach(function(row){
          writeRow(row);
          summableCols.forEach(function(c){ sums[c] += Number(row.cells[c])||0; });
        });
        var subtotalRow = headers.map(function(){ return null; });
        subtotalRow[termCol] = 'Subtotal — ' + term;
        summableCols.forEach(function(c){ subtotalRow[c] = sums[c]; });
        aoa.push(subtotalRow);
      });
    } else {
      rows.forEach(function(row){ writeRow(row); });
    }

    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Processed');

    var srcName = state.sourceName || 'export.xlsx';
    var outName = 'processed-' + srcName.replace(/\.xls[x]?$/i, '') + '.xlsx';
    exportWithFrozenHeader(wb, outName, 2);
  });

  resetBtn.addEventListener('click', function(){
    state = null;
    fileInput.value = '';
    dropzoneLabel.textContent = 'Upload Maybank QRPay export (.xlsx)';
    statusLine.textContent = '';
    statusLine.classList.remove('error');
    issuesBlock.innerHTML = '';
    rangeNote.classList.remove('undetermined');
    results.classList.remove('show');
  });
})();
</script>
