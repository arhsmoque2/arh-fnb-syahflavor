<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SyahFlavor QR Ledger</title>
<meta name="description" content="Upload the Maybank QRPay export, get a per-QR-ID summary and a sorted, totalled spreadsheet back — nothing leaves your phone.">
<style>
  :root{
    color-scheme: light dark;
    --ink:#201A16; --paper:#F3F0E8; --paper-2:#EAE4D6;
    --ember:#D8451B; --ember-ink:#FFF6F0;
    --jade:#1F6F54; --jade-ink:#EAF7F1;
    --turmeric:#A9700F; --turmeric-ink:#FDF4E1;
    --line: rgba(32,26,22,.14);
    --text: var(--ink); --text-dim:#5B554C;
    --surface:#FFFFFF; --surface-2: var(--paper-2); --bg: var(--paper);
    --shadow: 0 1px 2px rgba(32,26,22,.07), 0 6px 18px rgba(32,26,22,.07);
    --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
    --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#F3EFE7; --paper:#17130F; --paper-2:#221C15;
      --ember:#FF7A4A; --ember-ink:#2A1206;
      --jade:#57D9AB; --jade-ink:#0C2721;
      --turmeric:#E8B24E; --turmeric-ink:#2C1E07;
      --line: rgba(243,239,231,.14); --text: var(--ink); --text-dim:#B7B0A2;
      --surface:#221C15; --surface-2:#2B241B; --bg: var(--paper);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 32px);
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2{ font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; }
  .wrap{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  header{ display:flex; align-items:center; gap:10px; }
  .mark{
    width:38px; height:38px; border-radius:10px; flex:none;
    background:var(--ember); color:var(--ember-ink);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:1.15rem;
  }
  header .title{ display:flex; flex-direction:column; line-height:1.25; }
  header .title strong{ font-size:1.25rem; }
  header .title span{ font-size:.78rem; color:var(--text-dim); }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:16px; box-shadow:var(--shadow);
  }

  .dropzone{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    border:1.5px dashed var(--line); border-radius:13px; padding:26px 14px;
    cursor:pointer; color:var(--text-dim); font-weight:600; font-size:.95rem; text-align:center;
  }
  .dropzone svg{ width:1.8em; height:1.8em; color:var(--ember); }
  .dropzone small{ font-weight:400; font-size:.78rem; }
  #fileInput{ display:none; }
  .status-line{ font-size:.82rem; color:var(--text-dim); margin-top:10px; min-height:1.1em; }
  .status-line.error{ color:var(--ember); font-weight:600; }

  #results{ display:none; flex-direction:column; gap:18px; }
  #results.show{ display:flex; }

  .range-note{ font-size:.82rem; color:var(--text-dim); }

  .grand{ display:flex; flex-direction:column; gap:6px; }
  .grand .label{ font-size:.8rem; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; }
  .copy-amt{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--jade-ink); color:var(--jade); border:none; border-radius:13px;
    padding:16px 18px; cursor:pointer; width:100%; text-align:left;
  }
  .copy-amt .num{ font-family:var(--font-display); font-weight:700; font-size:2rem; font-variant-numeric: tabular-nums; }
  .copy-amt .hint{ font-size:.72rem; opacity:.8; font-weight:600; white-space:nowrap; }
  .copy-amt.copied .hint::after{ content:' ✓'; }

  .subtitle{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .subtitle h2{ font-size:1.05rem; }
  .subtitle .count{ font-size:.78rem; color:var(--text-dim); }

  .term-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .term-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:13px 14px;
    display:flex; flex-direction:column; gap:8px;
  }
  .term-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .term-name{ font-weight:700; font-size:.95rem; overflow-wrap:anywhere; }
  .term-count{ font-size:.75rem; color:var(--text-dim); white-space:nowrap; }
  .copy-sub{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface-2); border:none; border-radius:10px;
    padding:11px 13px; cursor:pointer; width:100%; text-align:left; color:var(--text);
  }
  .copy-sub .num{ font-family:var(--font-display); font-weight:700; font-size:1.3rem; font-variant-numeric: tabular-nums; }
  .copy-sub .hint{ font-size:.68rem; color:var(--text-dim); font-weight:600; white-space:nowrap; }
  .copy-sub.copied .hint::after{ content:' ✓'; color:var(--jade); }
  .term-extra{ display:grid; grid-template-columns:repeat(2,1fr); gap:4px 10px; font-size:.76rem; color:var(--text-dim); }
  .term-extra span b{ color:var(--text); font-weight:600; font-variant-numeric: tabular-nums; }

  .download-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--ember); color:var(--ember-ink); border:none; border-radius:13px;
    padding:15px; font-weight:700; font-size:1rem; cursor:pointer; box-shadow:var(--shadow);
  }
  .download-btn svg{ width:1.2em; height:1.2em; }

  .reset-link{
    align-self:center; background:none; border:none; color:var(--text-dim);
    font-size:.8rem; text-decoration:underline; cursor:pointer; padding:6px;
  }

  .stateless-note{
    font-size:.76rem; color:var(--text-dim); text-align:center; line-height:1.5;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="mark">SF</span>
      <div class="title">
        <strong>SyahFlavor QR Ledger</strong>
        <span>Upload the bank export, get totals back</span>
      </div>
    </header>

    <div class="card">
      <label class="dropzone" for="fileInput" id="dropzone">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4m0 0-4 4m4-4 4 4M5 16v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="dropzoneLabel">Upload Maybank QRPay export (.xlsx)</span>
        <small>Tap to choose a file</small>
      </label>
      <input id="fileInput" type="file" accept=".xlsx,.xls">
      <div class="status-line" id="statusLine"></div>
    </div>

    <div id="results">
      <p class="range-note" id="rangeNote"></p>

      <div class="grand">
        <span class="label">Grand total — Amount Paid to Merchant</span>
        <button class="copy-amt" id="copyGrand" type="button">
          <span class="num" id="grandNum">RM 0.00</span>
          <span class="hint">Tap to copy</span>
        </button>
      </div>

      <div>
        <div class="subtitle">
          <h2>Per QR ID</h2>
          <span class="count" id="termCount">0 terminals</span>
        </div>
        <ul class="term-list" id="termList"></ul>
      </div>

      <button class="download-btn" id="downloadBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Download processed file
      </button>

      <button class="reset-link" id="resetBtn" type="button">Process another file</button>
    </div>

    <p class="stateless-note">Nothing is uploaded to a server — the file is read and totalled entirely on this phone. Close this tab and it's gone; reload to start again.</p>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  "use strict";

  function norm(s){ return (s==null?'':String(s)).toLowerCase().replace(/[^a-z0-9]/g,''); }
  function fmtRM(n){ return 'RM ' + (Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtDate(d){
    if(!(d instanceof Date) || isNaN(d)) return '';
    return d.toLocaleDateString('en-MY',{day:'numeric',month:'short',year:'numeric'});
  }

  var fileInput = document.getElementById('fileInput');
  var dropzoneLabel = document.getElementById('dropzoneLabel');
  var statusLine = document.getElementById('statusLine');
  var results = document.getElementById('results');
  var rangeNote = document.getElementById('rangeNote');
  var grandNum = document.getElementById('grandNum');
  var copyGrand = document.getElementById('copyGrand');
  var termList = document.getElementById('termList');
  var termCount = document.getElementById('termCount');
  var downloadBtn = document.getElementById('downloadBtn');
  var resetBtn = document.getElementById('resetBtn');

  var state = null; // { headers, rows, termKey, amtKey, summableKeys, sourceName }

  function showError(msg){
    statusLine.textContent = msg;
    statusLine.classList.add('error');
    results.classList.remove('show');
  }
  function showStatus(msg){
    statusLine.textContent = msg;
    statusLine.classList.remove('error');
  }

  function copyToClipboard(text, btn){
    var done = function(){
      btn.classList.add('copied');
      setTimeout(function(){ btn.classList.remove('copied'); }, 1400);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }
  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }

  fileInput.addEventListener('change', function(){
    var file = fileInput.files && fileInput.files[0];
    if(!file) return;
    dropzoneLabel.textContent = file.name;
    showStatus('Reading file…');
    var reader = new FileReader();
    reader.onload = function(){
      try{ processWorkbook(new Uint8Array(reader.result), file.name); }
      catch(err){ showError("Couldn't read that file — make sure it's the .xlsx export, not a screenshot or PDF."); }
    };
    reader.onerror = function(){ showError('Could not read the file from your phone storage. Try again.'); };
    reader.readAsArrayBuffer(file);
  });

  function processWorkbook(bytes, sourceName){
    var wb = XLSX.read(bytes, {type:'array', cellDates:true});
    var ws = wb.Sheets[wb.SheetNames[0]];
    var aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:null});
    if(!aoa.length){ showError('That file has no rows.'); return; }
    var headers = aoa[0].map(function(h){ return h==null ? '' : String(h); });
    var dataRows = aoa.slice(1).filter(function(r){ return r.some(function(c){ return c!==null && c!==''; }); });
    if(!dataRows.length){ showError('That file has a header row but no transactions.'); return; }

    function findCol(needle){
      var nn = norm(needle);
      var exact = headers.findIndex(function(h){ return norm(h)===nn; });
      if(exact>=0) return exact;
      return headers.findIndex(function(h){ return norm(h).indexOf(nn)>=0; });
    }
    var timeCol = findCol('Date & Time');
    var termCol = findCol('Cashier ID/Terminal ID');
    if(termCol<0) termCol = findCol('Terminal ID');
    if(timeCol<0){ showError("Couldn't find a Date & Time column — is this a QRPay export?"); return; }
    if(termCol<0){ showError("Couldn't find a Terminal ID / QR ID column — is this a QRPay export?"); return; }

    // detect summable columns: every non-null value across data rows is numeric, excluding the time/term columns
    var summableCols = [];
    for(var c=0;c<headers.length;c++){
      if(c===timeCol || c===termCol) continue;
      var allNumeric = true, sawAny = false;
      for(var r=0;r<dataRows.length;r++){
        var v = dataRows[r][c];
        if(v===null || v==='') continue;
        sawAny = true;
        if(typeof v !== 'number'){ allNumeric = false; break; }
      }
      if(sawAny && allNumeric) summableCols.push(c);
    }
    var amtCol = findCol('Amount Paid to Merchant (RM)');
    if(amtCol<0) amtCol = findCol('Amount Paid to Merchant');
    if(amtCol<0 || summableCols.indexOf(amtCol)<0){ amtCol = summableCols[0]; }
    if(amtCol==null || amtCol<0){ showError("Couldn't find an amount column to total."); return; }

    // normalize rows: keep original cell values, resolve time to a Date
    var rows = dataRows.map(function(r){
      var t = r[timeCol];
      var d = (t instanceof Date) ? t : (typeof t==='number' ? new Date(Math.round((t-25569)*86400*1000)) : new Date(t));
      return { cells: r, time: d, term: r[termCol]==null || r[termCol]==='' ? '(no QR ID recorded)' : String(r[termCol]) };
    }).filter(function(r){ return !isNaN(r.time); });

    if(!rows.length){ showError('Could not read any valid dates from that file.'); return; }

    rows.sort(function(a,b){
      if(a.term!==b.term) return a.term<b.term ? -1 : 1;
      return a.time - b.time;
    });

    state = { headers:headers, rows:rows, timeCol:timeCol, termCol:termCol, amtCol:amtCol, summableCols:summableCols, sourceName:sourceName };
    renderSummary();
    showStatus(rows.length + ' transactions loaded, sorted by QR ID.');
    results.classList.add('show');
  }

  function renderSummary(){
    var rows = state.rows, headers = state.headers, amtCol = state.amtCol, summableCols = state.summableCols;

    var minT = rows[0].time, maxT = rows[0].time;
    rows.forEach(function(r){ if(r.time<minT) minT=r.time; if(r.time>maxT) maxT=r.time; });
    rangeNote.textContent = (fmtDate(minT)===fmtDate(maxT)) ? fmtDate(minT) : (fmtDate(minT) + ' – ' + fmtDate(maxT));

    var grandTotal = 0;
    rows.forEach(function(r){ grandTotal += Number(r.cells[amtCol])||0; });
    grandNum.textContent = fmtRM(grandTotal);
    copyGrand.onclick = function(){ copyToClipboard(grandTotal.toFixed(2), copyGrand); };

    var byTerm = {};
    var order = [];
    rows.forEach(function(r){
      if(!byTerm[r.term]){ byTerm[r.term] = {count:0, sums:{}}; order.push(r.term); }
      byTerm[r.term].count++;
      summableCols.forEach(function(c){
        byTerm[r.term].sums[c] = (byTerm[r.term].sums[c]||0) + (Number(r.cells[c])||0);
      });
    });

    termCount.textContent = order.length + ' terminal' + (order.length===1?'':'s');
    termList.innerHTML = '';
    order.forEach(function(term){
      var t = byTerm[term];
      var li = document.createElement('li');
      li.className = 'term-card';
      var extraCols = summableCols.filter(function(c){ return c!==amtCol; });
      var extraHtml = extraCols.map(function(c){
        return '<span>'+escapeHtml(headers[c])+': <b>'+fmtRM(t.sums[c])+'</b></span>';
      }).join('');
      li.innerHTML =
        '<div class="term-head"><span class="term-name">'+escapeHtml(term)+'</span>' +
        '<span class="term-count">'+t.count+' txn'+(t.count===1?'':'s')+'</span></div>' +
        '<button class="copy-sub" type="button" data-term="'+escapeHtml(term)+'"><span class="num">'+fmtRM(t.sums[amtCol])+'</span><span class="hint">Tap to copy</span></button>' +
        (extraHtml ? '<div class="term-extra">'+extraHtml+'</div>' : '');
      var btn = li.querySelector('.copy-sub');
      btn.addEventListener('click', function(){ copyToClipboard(t.sums[amtCol].toFixed(2), btn); });
      termList.appendChild(li);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  downloadBtn.addEventListener('click', function(){
    if(!state) return;
    var headers = state.headers, rows = state.rows, amtCol = state.amtCol, summableCols = state.summableCols, termCol = state.termCol, timeCol = state.timeCol;
    var aoa = [headers];

    var byTerm = {}, order = [];
    rows.forEach(function(r){
      if(!byTerm[r.term]){ byTerm[r.term]=[]; order.push(r.term); }
      byTerm[r.term].push(r);
    });

    var grand = {};
    summableCols.forEach(function(c){ grand[c]=0; });

    order.forEach(function(term){
      var group = byTerm[term];
      var sums = {};
      summableCols.forEach(function(c){ sums[c]=0; });
      group.forEach(function(r){
        var rowOut = r.cells.slice();
        rowOut[timeCol] = r.time;
        aoa.push(rowOut);
        summableCols.forEach(function(c){ sums[c] += Number(r.cells[c])||0; grand[c] += Number(r.cells[c])||0; });
      });
      var subtotalRow = headers.map(function(){ return null; });
      subtotalRow[termCol] = 'Subtotal — ' + term;
      summableCols.forEach(function(c){ subtotalRow[c] = sums[c]; });
      aoa.push(subtotalRow);
    });

    aoa.push(headers.map(function(){ return null; }));
    var grandRow = headers.map(function(){ return null; });
    grandRow[termCol] = 'GRAND TOTAL';
    summableCols.forEach(function(c){ grandRow[c] = grand[c]; });
    aoa.push(grandRow);

    var ws = XLSX.utils.aoa_to_sheet(aoa);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Processed');

    var srcName = state.sourceName || 'export.xlsx';
    var outName = 'processed-' + srcName.replace(/\.xls[x]?$/i, '') + '.xlsx';
    XLSX.writeFile(wb, outName);
  });

  resetBtn.addEventListener('click', function(){
    state = null;
    fileInput.value = '';
    dropzoneLabel.textContent = 'Upload Maybank QRPay export (.xlsx)';
    statusLine.textContent = '';
    statusLine.classList.remove('error');
    results.classList.remove('show');
  });
})();
</script>
</body>
</html>
